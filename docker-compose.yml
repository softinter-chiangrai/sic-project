services:
  # ============================================================================
  # 1. Database Service (PostgreSQL 17)
  # ============================================================================
  sic-database:
    image: postgres:17-alpine
    container_name: sic-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-administrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Sic2026}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-54320}:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
      - ./sic-database/infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-administrator} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sic-network

  # ============================================================================
  # 2. Authentication Service (Keycloak)
  # ============================================================================
  sic-auth:
    image: quay.io/keycloak/keycloak:latest
    container_name: sic-auth
    restart: unless-stopped
    depends_on:
      sic-database:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://sic-database:5432/${KEYCLOAK_DB_NAME:-sic_auth}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-sic-auth}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-SicAuth2026}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-administrator}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Sicr@2026}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: "edge"
    volumes:
      - ./sic-auth/infra/keycloak/realm-one-project.json:/opt/keycloak/data/import/realm-one-project.json:ro
      - ./sic-auth/mint-keywind-theme-main/theme:/opt/keycloak/themes:ro
      - keycloak_data:/opt/keycloak/data
    command:
      - "start-dev"
      - "--http-port=8080"
      - "--import-realm"
      - "--spi-theme-cache-themes=false"
      - "--spi-theme-cache-templates=false"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    networks:
      - sic-network

  # ============================================================================
  # 3. Object Storage Service (SeaweedFS)
  # ============================================================================
  sic-seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: sic-seaweedfs
    restart: unless-stopped
    command:
      - "server"
      - "-ip=sic-seaweedfs"
      - "-ip.bind=0.0.0.0"
      - "-dir=/data"
      - "-volume.max=0"
      - "-s3"
      - "-s3.config=/etc/seaweedfs/s3.conf"
    ports:
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"
      - "${SEAWEEDFS_VOLUME_PORT:-8081}:8080"
      - "${SEAWEEDFS_S3_PORT:-8888}:8333"
    volumes:
      - seaweedfs_data:/data
      - ./sic-storage/infra/seaweedfs/s3.conf:/etc/seaweedfs/s3.conf:ro
    networks:
      - sic-network

  # ============================================================================
  # 4. Storage Bucket Initialization
  # ============================================================================
  sic-seaweedfs-init:
    image: minio/mc:latest
    container_name: sic-seaweedfs-init
    depends_on:
      - sic-seaweedfs
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://sic-seaweedfs:8333 ${SEAWEEDFS_ACCESS_KEY:-seaweedfs} ${SEAWEEDFS_SECRET_KEY:-seaweedfs-secret}; do
        echo 'Waiting for SeaweedFS S3 to be ready...';
        sleep 2;
      done;
      mc mb --ignore-existing local/uploads;
      mc mb --ignore-existing local/documents;
      mc mb --ignore-existing local/public-files;
      echo 'SeaweedFS buckets successfully initialized.';
      "
    restart: "no"
    networks:
      - sic-network

  # ============================================================================
  # 5. Report Service
  # ============================================================================
  sic-report-service:
    container_name: sic-report-service
    restart: unless-stopped
    build:
      context: ./report-service
      dockerfile: ./docker/Dockerfile
    ports:
      - "${REPORT_SERVICE_PORT:-8082}:80"
    environment:
      SPRING_PROFILES_ACTIVE: production
      REPORT_SERVICE_TOKEN: ${REPORT_SERVICE_TOKEN:-sw7vuLj4VcTyksKN9ZFNYDRmtu_O2uYk}
    networks:
      - sic-network

  # ============================================================================
  # 6. Backend API (Spring Boot)
  # ============================================================================
  sic-spring:
    container_name: sic-spring-backend
    restart: unless-stopped
    build:
      context: ./sic-spring/sic
      dockerfile: Dockerfile
    depends_on:
      sic-database:
        condition: service_healthy
      sic-auth:
        condition: service_started
      sic-seaweedfs:
        condition: service_started
    ports:
      - "${SPRING_SERVER_PORT:-5265}:5265"
    environment:
      # Server port
      SERVER_PORT: ${SPRING_SERVER_PORT:-5265}

      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://sic-database:5432/${SIC_APP_DB_NAME:-sic_app}
      SPRING_DATASOURCE_USERNAME: ${SIC_APP_DB_USER:-sic-app}
      SPRING_DATASOURCE_PASSWORD: ${SIC_APP_DB_PASSWORD:-SicApp2026}

      # Keycloak Configuration
      APP_KEYCLOAK_AUTH_SERVER_URL: ${APP_KEYCLOAK_AUTH_SERVER_URL:-http://sic-auth:8080}
      APP_KEYCLOAK_REALM: ${APP_KEYCLOAK_REALM:-sic-project}
      APP_KEYCLOAK_RESOURCE: ${APP_KEYCLOAK_RESOURCE:-sic-app}

      # S3 / SeaweedFS Configuration
      APP_STORAGE_S3_ENDPOINT: ${APP_STORAGE_S3_ENDPOINT:-http://sic-seaweedfs:8888}
      APP_STORAGE_S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs}
      APP_STORAGE_S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-seaweedfs-secret}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-public-files}
      APP_STORAGE_S3_DOCUMENT_BUCKET: ${APP_STORAGE_S3_DOCUMENT_BUCKET:-documents}

      # Report Service Configuration
      REPORT_SERVICE_URL: ${REPORT_SERVICE_URL:-http://sic-report-service:80}
      REPORT_SERVICE_TOKEN: ${REPORT_SERVICE_TOKEN:-sw7vuLj4VcTyksKN9ZFNYDRmtu_O2uYk}

      # AI API Keys
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-${AI_API_KEY:-}}
      AI_API_KEY: ${CLAUDE_API_KEY:-${AI_API_KEY:-}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-gemini-2.5-flash-lite}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}

      # Figma Configuration
      FIGMA_CLIENT_ID: ${FIGMA_CLIENT_ID:-nHawYGgjLQRdiNyVylbvpw}
      FIGMA_CLIENT_SECRET: ${FIGMA_CLIENT_SECRET:-gRKO02QqgLYIsxrSL4txGeb7i2GXsYzu7FvInpTU}
      FIGMA_REDIRECT_URI: ${FIGMA_REDIRECT_URI:-http://localhost:4200/feature/pm/design-review}
    networks:
      - sic-network

  # ============================================================================
  # 7. Frontend Application (Angular SSR)
  # ============================================================================
  sic-app:
    container_name: sic-frontend-app
    restart: unless-stopped
    build:
      context: ./sic-app
      dockerfile: Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      - sic-spring
    ports:
      - "${APP_PORT:-4200}:4200"
    environment:
      PORT: 4200
      NODE_ENV: production
    networks:
      - sic-network

# ============================================================================
# Persistent Volumes (Mapped to existing project volumes)
# ============================================================================
volumes:
  keycloak_db_data:
    name: sic-database_keycloak_db_data
  keycloak_data:
    name: sic-auth_keycloak_data
  seaweedfs_data:
    name: sic-storage_seaweedfs_data

# ============================================================================
# Shared Network
# ============================================================================
networks:
  sic-network:
    name: sic-network
    driver: bridge
