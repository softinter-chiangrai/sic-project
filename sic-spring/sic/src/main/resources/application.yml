  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    validate-on-migrate: false
    locations: classpath:db/migration
    schemas: public
    table: flyway_schema_history

  devtools:
    add-properties: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  web:
    cors:
      allowed-origins:
        - http://localhost:4200

  mail:
    host: smtp.gmail.com
    port: 587
    username: phurinsukman3@gmail.com
    password: qeivnricakfexxzh
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  data:
    web:
      pageable:
        one-indexed-parameters: true   

app:
  keycloak:
    realm: sic-project
    auth-server-url: http://localhost:8080
    ssl-required: none
    resource: sic-app
    verify-token-audience: false
    credentials:
      secret: ""
    confidential-port: 0

  storage:
    s3:
      bucket: public-files
      document-bucket: documents
      region: us-east-1
      access-key: seaweedfs
      secret-key: seaweedfs-secret
      endpoint: http://localhost:8888
      path-style-access-enabled: true

