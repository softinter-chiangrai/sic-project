server:
  port: 5265

spring:
  main:
    banner-mode: "off"
    
  datasource:
    url: jdbc:postgresql://localhost:54320/sic_app
    username: sic-app
    password: ${SIC_APP_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

# spring:
#   main:
#     banner-mode: "off"

#   datasource:
#     url: jdbc:postgresql://localhost:54320/postgres
#     username: administrator
#     password: Sic2026
#     driver-class-name: org.postgresql.Driver


  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    validate-on-migrate: false
    locations: classpath:db/migration
    schemas: public
    table: flyway_schema_history

  devtools:
    add-properties: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  web:
    cors:
      allowed-origins:
        - http://localhost:4200

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  data:
    web:
      pageable:
        one-indexed-parameters: true   

app:
  keycloak:
    realm: sic-project
    auth-server-url: http://localhost:8080
    ssl-required: none
    resource: sic-app
    verify-token-audience: false
    credentials:
      secret: ""
    confidential-port: 0

  storage:
    s3:
      bucket: public-files
      document-bucket: documents
      region: us-east-1
      access-key: seaweedfs
      secret-key: ${SEAWEEDFS_SECRET_KEY:}
      endpoint: http://localhost:8888
      path-style-access-enabled: true

  ai:
    default-model: ${AI_DEFAULT_MODEL:gemini-3.8-flash}
    # ใช้เข้ารหัส api_key ในตาราง db_ai_model_config (AiApiKeyConverter) ตั้งค่าจริงผ่าน env var นี้ใน production
    config-encryption-key: ${AI_MODEL_CONFIG_ENCRYPTION_KEY:sic-ai-model-config-dev-only-key}
    claude:
      api-key: ${CLAUDE_API_KEY:}
      model: ${CLAUDE_MODEL:claude-sonnet-5}
      api-url: ${CLAUDE_API_URL:https://gen.ai.kku.ac.th/upacth/api/v1/chat/completions}
      max-tokens: 4096
      anthropic-version: 2023-06-01
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      api-url: ${GEMINI_API_URL:https://gen.ai.kku.ac.th/upacth/api/v1/chat/completions}
      max-tokens: 4096

  figma:
    client-id: ${FIGMA_CLIENT_ID:}
    client-secret: ${FIGMA_CLIENT_SECRET:}
    redirect-uri: http://localhost:4200/feature/pm/design-review

  report-service:
    enabled: true
    base-url: ${REPORT_SERVICE_URL:http://localhost:80}
    access-token: ${REPORT_SERVICE_TOKEN:}
    timeout-seconds: 30
    fallback-to-local: true


logging:
  pattern:
    console: "%msg%n"
  level:
    root: WARN
    com.softinter.sicapi: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.tomcat: WARN
    com.zaxxer.hikari: WARN
    org.springframework.messaging: WARN
    org.springframework.web.socket: WARN
    org.springframework.data.repository: WARN
