@let url = kcContext.url;

<app-main-layout [subtitle]="i18n.msgStr('updatePasswordTitle')">
  <form
    id="kc-passwd-update-form"
    method="post"
    [action]="url?.loginAction"
    (submit)="handleSubmit($event)"
  >
    <sic-input-password
      name="password-new"
      autocomplete="new-password"
      [label]="i18n.msgStr('passwordNew')"
      [formControl]="updateForm.controls.passwordNew"
      [errorMessages]="{ required: i18n.msgStr('passwordNew') + ' is required' }"
    />

    <sic-input-password
      name="password-confirm"
      autocomplete="new-password"
      [label]="i18n.msgStr('passwordConfirm')"
      [formControl]="updateForm.controls.passwordConfirm"
      [errorMessages]="{ required: i18n.msgStr('passwordConfirm') + ' is required' }"
    />

    <sic-flex
      align="center"
      class="kc-sic-form-options"
    >
      <sic-checkbox
        [label]="i18n.msgStr('logoutOtherSessions')"
        [formControl]="updateForm.controls.logoutOtherSessions"
      />
      <!-- sic-checkbox ยังไม่ forward name ไป native input — ใช้ hidden input คู่กันเหมือน rememberMe ในหน้า login -->
      <input
        type="hidden"
        name="logout-sessions"
        [value]="updateForm.controls.logoutOtherSessions.value ? 'on' : ''"
      />
    </sic-flex>

    <sic-button
      type="submit"
      variant="solid"
      color="primary"
      size="sm"
      [block]="!isAppInitiatedAction"
      class="kc-sic-submit"
    >
      {{ i18n.msgStr('doSubmit') }}
    </sic-button>

    @if (isAppInitiatedAction) {
      <sic-button
        type="submit"
        name="cancel-aia"
        value="true"
        variant="outline"
        color="secondary"
        size="sm"
        class="kc-sic-submit"
      >
        {{ i18n.msgStr('doCancel') }}
      </sic-button>
    }
  </form>
</app-main-layout>
