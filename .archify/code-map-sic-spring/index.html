<style>
:root{--bg:#f7f8fa;--panel:#fff;--ink:#1c2230;--mute:#6b7488;--line:#e3e6ec;--acc:#0e7490;--accbg:#e0f2f7;--chip:#eef1f6;
--controller:#0e7490;--service:#7c3aed;--repository:#b45309;--entity:#047857;--dto:#be185d;--config:#475569;--util:#64748b;--resource:#9a3412;--other:#64748b}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--panel:#171c27;--ink:#e6e9f0;--mute:#8f99ad;--line:#262d3c;--acc:#38bdf8;--accbg:#12303d;--chip:#222a39;
--controller:#38bdf8;--service:#a78bfa;--repository:#fbbf24;--entity:#34d399;--dto:#f472b6;--config:#94a3b8;--util:#94a3b8;--resource:#fb923c;--other:#94a3b8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0}header small{color:var(--mute)}
main{flex:1;display:flex;min-height:0}
#side{width:340px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#side .ctl{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#tree{overflow:auto;flex:1;padding:6px 0}
.grp{padding:4px 12px;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer;position:sticky;top:0;background:var(--panel)}
.item{padding:3px 12px 3px 22px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.item:hover{background:var(--chip)}.item.sel{background:var(--accbg);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--other)}
#view{flex:1;overflow:auto;padding:20px 28px}
h2{margin:0 0 4px;font-size:20px;word-break:break-all}h3{margin:22px 0 8px;font-size:14px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.path{color:var(--mute);font:12px ui-monospace,Consolas,monospace;word-break:break-all}
.badge{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;color:#fff;margin-right:6px}
.role{margin:10px 0;padding:10px 14px;background:var(--accbg);border-left:3px solid var(--acc);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600}
code,.mono{font:12px ui-monospace,Consolas,monospace}
a.f{color:var(--acc);cursor:pointer;text-decoration:none}a.f:hover{text-decoration:underline}
.lst{display:flex;flex-direction:column;gap:2px}.lst a{display:block}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.verb{font:bold 11px ui-monospace,monospace;padding:1px 6px;border-radius:3px;color:#fff;display:inline-block;min-width:52px;text-align:center}
.GET{background:#16a34a}.POST{background:#2563eb}.PUT{background:#d97706}.DELETE{background:#dc2626}.PATCH{background:#7c3aed}
.chain div{padding:1px 0;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}
.card b{font-size:22px;display:block}.muted{color:var(--mute)}
pre{background:var(--chip);padding:8px;border-radius:6px;overflow:auto;font-size:12px;margin:4px 0}
@media(max-width:800px){main{flex-direction:column}#side{width:100%;height:42vh}}
</style>
</head>

function role(o){
 if(o.kind!==undefined){ // resource

 t.innerHTML=h||'<div class="item muted">ไม่พบ</div>';

function chain(p,depth,seen,pre){
 if(depth>3)return'';const o=BY[p];let h='';

 return h}

 if(o.table)h+=`<h3>ตาราง</h3><div class="mono">${esc(o.table)}</div>`;
 if(o.fields&&o.fields.length&&(l==='entity'||l==='dto'))h+=`<h3>Fields (${o.fieldCount})</h3><div class="mono" style="columns:2;font-size:12px">${o.fields.map(esc).join('<br>')}</div>`;

 if(o.params&&o.params.length)h+=`<h3>Report parameters</h3><div class="mono">${o.params.map(esc).join(', ')}</div>`;
 if(o.migrations&&o.migrations.length)h+=`<h3>Migration ที่เกี่ยวข้อง (${o.migrations.length})</h3><div class="lst">${o.migrations.map(link).join('')}</div>`;
 h+='<div class="cols">';
