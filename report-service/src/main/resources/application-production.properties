# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=${PORT:80}

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,metrics

# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=report-service

# ===============================
# SPRINGDOC / SWAGGER UI
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# spring.thymeleaf.cache=false
# spring.web.resources.chain.cache=false
# spring.web.resources.cache.period=0
# spring.devtools.livereload.enabled=true

spring.web.resources.chain.cache=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.properties.hibernate.default_schema="report-service"

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.h2.console.path=/h2-console
spring.h2.console.enabled=true
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

spring.datasource.url=jdbc:h2:file:./data/report-service
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}

# ===============================
# SECURITY
# ===============================
# Login session (HttpSession) timeout - user is logged out after this much inactivity
server.servlet.session.timeout=12h

# Frontend CORS origins for public report downloads (comma separated)
app.cors.allowed-origins=*

# Disabling default Spring Security password generation
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin}

# Remember-me session duration in days when the login checkbox is selected
app.security.remember-me.days=30
# Remember-me key used by Spring Security token signing
app.security.remember-me.key=report-service-remember-me

# ===============================
# FILE STORAGE CONFIGURATION
# ===============================
# Upload directory for file storage (relative or absolute path)
file.reports-uploads-dir=data/uploads
file.reports-generated-dir=data/generated
file.reports-output-dir=data/reports
file.reports-bulk-dir=data/bulk

# Settings / cleanup scheduler
app.settings.cleanup.scheduler-enabled=true

# ===============================
# REPORT GENERATION QUEUE
# ===============================
app.queue.report-generation.enabled=true
app.queue.report-generation.poll-interval-ms=5000
app.queue.report-generation.batch-size=5
app.queue.webhook.connect-timeout-ms=5000
app.queue.webhook.request-timeout-ms=10000
app.queue.webhook.retry-delays-minutes=1,5,15
app.queue.webhook.retry-poll-interval-ms=30000