spring.datasource.url=jdbc:h2:mem:report-service-test;MODE=LEGACY
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=false
spring.jpa.properties.hibernate.default_schema=PUBLIC

spring.h2.console.enabled=false

file.reports-uploads-dir=target/test-uploads
file.reports-generated-dir=target/test-generated
file.reports-output-dir=target/test-reports

app.security.remember-me.days=30
app.security.remember-me.key=test-remember-me-key
app.settings.cleanup.scheduler-enabled=false