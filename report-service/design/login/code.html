<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JasperInsight | Secure Login</title>
<!-- Tailwind CSS with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Manrope & Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed-variant": "#4d5d73",
              "on-primary-container": "#0048bf",
              "on-primary-fixed": "#003798",
              "primary-dim": "#0048c1",
              "tertiary-fixed": "#d9d7f8",
              "on-tertiary-fixed": "#373851",
              "inverse-on-surface": "#9a9d9f",
              "outline": "#717c82",
              "surface-dim": "#cfdce3",
              "secondary-dim": "#44546a",
              "on-secondary-fixed": "#314055",
              "on-tertiary-fixed-variant": "#54546f",
              "tertiary-fixed-dim": "#cbc9e9",
              "outline-variant": "#a9b4b9",
              "on-error": "#fff7f6",
              "error-dim": "#4e0309",
              "tertiary": "#5d5d78",
              "secondary-fixed-dim": "#c5d6f0",
              "surface-variant": "#d9e4ea",
              "on-background": "#2a3439",
              "surface-bright": "#f7f9fb",
              "surface-tint": "#0053db",
              "inverse-surface": "#0b0f10",
              "surface-container-low": "#f0f4f7",
              "primary-fixed-dim": "#c7d3ff",
              "on-primary-fixed-variant": "#0050d4",
              "surface-container-highest": "#d9e4ea",
              "on-surface": "#2a3439",
              "on-secondary": "#f7f9ff",
              "tertiary-container": "#d9d7f8",
              "error": "#9f403d",
              "surface-container-high": "#e1e9ee",
              "on-primary": "#f8f7ff",
              "tertiary-dim": "#51516c",
              "surface": "#f7f9fb",
              "primary-fixed": "#dbe1ff",
              "surface-container": "#e8eff3",
              "background": "#f7f9fb",
              "on-tertiary-container": "#4a4a65",
              "inverse-primary": "#618bff",
              "primary-container": "#dbe1ff",
              "on-error-container": "#752121",
              "surface-container-lowest": "#ffffff",
              "error-container": "#fe8983",
              "on-secondary-container": "#435368",
              "secondary-container": "#d3e4fe",
              "secondary": "#506076",
              "on-tertiary": "#fbf7ff",
              "secondary-fixed": "#d3e4fe",
              "primary": "#0053db",
              "on-surface-variant": "#566166"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.375rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Login Page Suppresses Nav Shell as per "The Destination Rule" (Transactional Intent) -->
<main class="relative min-h-screen flex items-center justify-center overflow-hidden p-6">
<!-- Subtle Reliability Pattern Background -->
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none" data-alt="Subtle blue geometric dot pattern on light background" style="background-image: radial-gradient(#0053db 0.5px, transparent 0.5px); background-size: 24px 24px;">
</div>
<!-- Abstract Decorative Layers for Depth -->
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-container/20 rounded-full blur-[100px] z-0"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-secondary-container/30 rounded-full blur-[100px] z-0"></div>
<!-- Login Container -->
<div class="relative z-10 w-full max-w-md">
<!-- Brand Identity -->
<div class="mb-10 text-center">
<div class="inline-flex items-center justify-center p-3 mb-4 rounded-xl bg-surface-container-lowest shadow-sm">
<span class="material-symbols-outlined text-primary text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">analytics</span>
</div>
<h1 class="font-headline font-extrabold text-4xl text-on-surface tracking-tight">Jasper Report Server</h1>
<p class="font-label text-sm uppercase tracking-widest text-on-surface-variant mt-2 font-medium">Management Console</p>
</div>
<!-- Form Card -->
<div class="glass-effect p-8 rounded-xl border border-outline-variant/15 shadow-2xl shadow-on-surface/5">
<div class="mb-8">
<h2 class="font-headline font-bold text-xl text-on-surface">Welcome back</h2>
<p class="font-body text-sm text-on-surface-variant mt-1">Please enter your credentials to access the console.</p>
</div>
<form class="space-y-6">
<!-- Email/Username Field -->
<div class="space-y-1.5">
<label class="font-label text-xs font-semibold uppercase tracking-wider text-on-surface-variant px-1" for="identity">Email or Username</label>
<div class="relative group">
<span class="absolute inset-y-0 left-4 flex items-center text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">person</span>
</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-0 focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant text-on-surface font-body text-sm" id="identity" name="identity" placeholder="name@company.com" type="text"/>
<div class="absolute bottom-0 left-0 h-[2px] w-0 bg-primary transition-all duration-300 group-focus-within:w-full"></div>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<div class="flex items-center justify-between px-1">
<label class="font-label text-xs font-semibold uppercase tracking-wider text-on-surface-variant" for="password">Password</label>
<a class="font-label text-[11px] font-bold text-primary hover:text-primary-dim transition-colors uppercase tracking-tight" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="absolute inset-y-0 left-4 flex items-center text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-0 focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant text-on-surface font-body text-sm" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute bottom-0 left-0 h-[2px] w-0 bg-primary transition-all duration-300 group-focus-within:w-full"></div>
</div>
</div>
<!-- Remember Me Toggle -->
<div class="flex items-center gap-3 px-1">
<input class="w-4 h-4 rounded-sm border-outline-variant text-primary focus:ring-primary/20" id="remember" type="checkbox"/>
<label class="font-body text-sm text-on-surface-variant select-none" for="remember">Stay logged in for 30 days</label>
</div>
<!-- Sign In Button -->
<button class="w-full py-3.5 bg-gradient-to-br from-primary to-primary-dim text-on-primary font-headline font-bold text-sm rounded-lg shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Alternative Methods -->
</div>
<!-- Footer Meta -->
</div>
</main>
<!-- Contextual Aesthetic Element -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/20 to-transparent"></div>
</body></html>
