name: report-service

networks:
    default:
        name: report-service-network
        driver: bridge

services:
    report-service:
        image: sarankon/report-service:latest
        container_name: report-service
        hostname: report-service
        restart: unless-stopped
        networks:
            - default
        ports:
            - 80:80
        environment:
            - TZ=UTC
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - ADMIN_USERNAME=${ADMIN_USERNAME}
            - ADMIN_PASSWORD=${ADMIN_PASSWORD}
        volumes:
            - ./data/report-service:/app/data:Z