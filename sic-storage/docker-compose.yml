services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: sic-seaweedfs
    command:
      [
        "server",
        "-ip=seaweedfs",
        "-ip.bind=0.0.0.0",
        "-dir=/data",
        "-volume.max=0",
        "-s3",
        "-s3.config=/etc/seaweedfs/s3.conf"
      ]
    ports:
      - "9333:9333"
      - "8081:8080"
      - "8888:8333"
    volumes:
      - seaweedfs_data:/data
      - ./infra/seaweedfs/s3.conf:/etc/seaweedfs/s3.conf:ro
    restart: unless-stopped

  seaweedfs-init:
    image: amazon/aws-cli:latest
    container_name: sic-storage-init
    depends_on:
      - seaweedfs
    environment:
      - AWS_ACCESS_KEY_ID=seaweedfs
      - AWS_SECRET_ACCESS_KEY=seaweedfs-secret
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://seaweedfs:8333 s3 ls; do
        echo 'waiting for seaweedfs s3...';
        sleep 2;
      done;
      aws --endpoint-url http://seaweedfs:8333 s3 mb s3://uploads || true;
      aws --endpoint-url http://seaweedfs:8333 s3 mb s3://documents || true;
      aws --endpoint-url http://seaweedfs:8333 s3 mb s3://public-files || true;
      echo 'seaweedfs buckets initialized';
      "
    restart: "no"

volumes:
  seaweedfs_data:
