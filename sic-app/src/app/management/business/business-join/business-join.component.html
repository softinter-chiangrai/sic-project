<form [formGroup]="tokenForm" (ngSubmit)="submit()">
  <div class="grid grid-cols-6 gap-4">

    <!-- Title -->
    <div class="col-span-6 text-center">
      <h2 class="text-4xl font-semibold">{{ 'BUSINESS_JOIN_HEADER' | translate }}</h2>
    </div>

    <div class="col-span-11 col-start-1 md:col-span-4 md:col-start-2 lg:col-span-2 lg:col-start-3">
      <p class="text-sm text-[var(--text-muted)]">{{ 'BUSINESS_JOIN_DESC' | translate }}</p>
    </div>

    <div class="col-span-11 col-start-1 md:col-span-4 md:col-start-2 lg:col-span-2 lg:col-start-3">
      <sic-input [label]="'BUSINESS_JOIN_TOKEN_LABEL' | translate" formControlName="token" [placeholder]="'BUSINESS_JOIN_TOKEN_PLACEHOLDER' | translate"></sic-input>
    </div>

    <div class="col-span-11 col-start-1 md:col-span-4 md:col-start-2 lg:col-span-2 lg:col-start-3 flex items-center justify-end gap-3 mt-5 pt-4 border-t border-[var(--border)]">
      <sic-button [type]="'button'" variant="outline" color="primary" (click)="onBack()">{{ 'BUSINESS_JOIN_BACK_BUTTON' | translate }}</sic-button>
      <sic-button [type]="'submit'" variant="solid" color="primary" [disabled]="loading()">{{ 'BUSINESS_JOIN_SUBMIT_BUTTON' | translate }}</sic-button>
    </div>

  </div>
</form>
