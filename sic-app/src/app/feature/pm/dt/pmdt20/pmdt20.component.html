<div class="space-y-5 p-0.5">

  <!-- ===== HEADER ===== -->
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <h1 class="text-2xl font-semibold text-[var(--text-active)] flex items-center gap-2">
        <i class="bi bi-clock-history text-[var(--crm-primary)]"></i>
        บันทึกการตรวจสอบ
      </h1>
      <span class="text-sm text-[var(--text-muted)] bg-[var(--bg)] px-3 py-0.5 rounded-full border border-[var(--border)]">
        {{ totalItems() }} รายการ
      </span>
    </div>
    <div class="flex gap-2">
      <button
        (click)="isLoading.set(!isLoading())"
        class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm border border-[var(--border)] bg-transparent text-[var(--text)] hover:bg-[var(--sidebar-hover)] transition-all"
      >
        <i class="bi bi-arrow-repeat" [class.animate-spin]="isLoading()"></i>
        รีเฟรช
      </button>
    </div>
  </div>

  <!-- ===== FILTERS ===== -->
  <div class="flex flex-wrap gap-3 items-center">
    <!-- Search -->
    <div class="relative flex-1 min-w-[200px]">
      <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-muted)] text-sm"></i>
      <input
        type="text"
        class="w-full pl-9 pr-9 py-2 rounded-lg border border-[var(--border)] bg-[var(--bg)] text-[var(--text)] text-sm focus:outline-none focus:ring-2 focus:ring-[var(--crm-primary)]/20 focus:border-[var(--crm-primary)] transition-all"
        placeholder="ค้นหาผู้ใช้, การกระทำ, รายละเอียด..."
        [value]="searchTerm()"
        (input)="onSearch($event, grid)"
      />
      @if (searchTerm()) {
        <button
          (click)="clearSearch(grid)"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-[var(--text-muted)] hover:text-[var(--text-active)] transition-colors"
        >
          <i class="bi bi-x-lg text-xs"></i>
        </button>
      }
    </div>

    <!-- Filter: Module -->
    <div class="min-w-[190px]">
      <sic-combobox
        [options]="moduleSelectOptions()"
        [ngModel]="filterModule()"
        (ngModelChange)="onModuleChange($event, grid)"
        placeholder="📋 ทุกโมดูล"
        [clearable]="true"
      ></sic-combobox>
    </div>

    <!-- Filter: Status -->
    <div class="min-w-[160px]">
      <sic-combobox
        [options]="statusSelectOptions"
        [ngModel]="filterStatus()"
        (ngModelChange)="onStatusChange($event, grid)"
        placeholder="📊 ทุกสถานะ"
        [clearable]="true"
      ></sic-combobox>
    </div>

    <!-- Filter: User -->
    <div class="min-w-[170px]">
      <sic-combobox
        [options]="userSelectOptions()"
        [ngModel]="filterUser()"
        (ngModelChange)="onUserChange($event, grid)"
        placeholder="👤 ทุกคน"
        [clearable]="true"
      ></sic-combobox>
    </div>
  </div>

  <!-- GRID -->
  <div class="rounded-xl border border-[var(--border)] bg-[var(--sidebar)] shadow-sm overflow-hidden">
    <sic-gridpanel
      #grid
      [config]="gridConfig"
      (loadData)="handleGridLoad($event, grid)"
    >
      <ng-template sicGridPanelTemplate="userInfo" section="cell" let-row>
        @let r = $any(row);
        <span class="font-medium text-[var(--text-active)]">{{ r.user }}</span>
        @if (r.ipAddress) {
          <div class="text-xs text-[var(--text-muted)]">{{ r.ipAddress }}</div>
        }
      </ng-template>

      <ng-template sicGridPanelTemplate="descText" section="cell" let-row>
        @let r = $any(row);
        <div class="text-sm text-[var(--text)] truncate max-w-[300px]" [title]="r.description">
          {{ r.description }}
        </div>
      </ng-template>

      <ng-template sicGridPanelTemplate="dateText" section="cell" let-row>
        @let r = $any(row);
        <span class="text-sm text-[var(--text-muted)] font-mono">{{ formatDate(r.timestamp) }}</span>
      </ng-template>

      <ng-template sicGridPanelTemplate="statusBadge" section="cell" let-row>
        @let r = $any(row);
        <span [class]="getStatusClass(r.status) + ' inline-block px-2.5 py-0.5 rounded-full text-xs font-medium'">
          {{ r.status }}
        </span>
      </ng-template>
    </sic-gridpanel>
  </div>

</div>
