<div class="p-6 bg-slate-50 min-h-screen">
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">
        {{ id() ? 'แก้ไขการชำระเงิน (Payment)' : 'บันทึกรับชำระเงินใหม่ (New Payment)' }}
      </h1>
      <p class="text-sm text-slate-500">บันทึกการชำระเงินและแนบหลักฐานการโอนเงิน</p>
    </div>
    <div class="flex gap-2">
      <sic-button variant="secondary" (click)="onBack()">ยกเลิก</sic-button>
      <sic-button variant="primary" [loading]="isSaving()" (click)="submit()">บันทึกข้อมูล</sic-button>
    </div>
  </div>

  @if (dataResource.isLoading()) {
    <div class="p-8 text-center text-slate-500">กำลังโหลดข้อมูล...</div>
  } @else {
    <form [formGroup]="formData.form" class="space-y-6">
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
        <h2 class="text-lg font-semibold text-slate-700 border-b pb-2">รายละเอียดการรับชำระเงิน</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <sic-combobox
            label="อ้างอิงใบแจ้งหนี้ (Invoice)"
            [required]="true"
            [apiUrl]="apiInvoiceCombobox"
            valueField="id"
            displayField="invoiceNo"
            formControlName="invoiceId"
          ></sic-combobox>

          <sic-input
            label="เลขที่ใบรับชำระ (Payment No)"
            placeholder="ระบบจะสร้างให้อัตโนมัติหากว่างไว้"
            formControlName="paymentNo"
          ></sic-input>

          <sic-datepicker
            label="วันที่ชำระเงิน (Payment Date)"
            [required]="true"
            formControlName="paymentDate"
          ></sic-datepicker>

          <sic-combobox
            label="ช่องทางการชำระ (Payment Method)"
            [required]="true"
            [items]="paymentMethodOptions"
            valueField="value"
            displayField="label"
            formControlName="paymentMethod"
          ></sic-combobox>

          <sic-input-number
            label="จำนวนเงินที่ชำระ (Amount)"
            formControlName="amount"
            [min]="0"
          ></sic-input-number>

          <sic-input
            label="เลขที่อ้างอิงโอนเงิน / เลขที่เช็ค"
            placeholder="เช่น TRX-98765432"
            formControlName="referenceNo"
          ></sic-input>

          <sic-input
            label="ธนาคารที่โอนเข้า (Bank Name)"
            placeholder="เช่น ธนาคารกสิกรไทย"
            formControlName="bankName"
          ></sic-input>
        </div>

        <div class="pt-4 border-t border-slate-100">
          <label class="block text-sm font-medium text-slate-700 mb-2">แนบหลักฐานสลิป / ใบเสร็จรับเงิน</label>
          <sic-upload formControlName="receiptFile"></sic-upload>
        </div>

        <div class="pt-4 border-t border-slate-100">
          <sic-input-area
            label="หมายเหตุการชำระเงิน"
            placeholder="รายละเอียดเพิ่มเติมของการรับชำระเงิน"
            formControlName="notes"
          ></sic-input-area>
        </div>
      </div>
    </form>
  }
</div>
