<!-- src/app/feature/pm/dt/pmdt02/pmdt02A/pmdt02A.component.html -->
<div class="max-w-2xl mx-auto">
  <h2 class="text-xl font-semibold text-[var(--text-active)] mb-4">
    {{ isEdit ? 'แก้ไข Milestone' : 'สร้าง Milestone ใหม่' }}
  </h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

    <div>
      <label class="block text-sm font-medium text-[var(--text)]">ชื่อ Milestone <span class="text-red-500">*</span></label>
      <input type="text" formControlName="milestoneName" class="w-full px-3 py-2 rounded-lg border border-[var(--border)] bg-[var(--bg)] text-[var(--text)] focus:ring-2 focus:ring-[var(--crm-primary)]/20 focus:border-[var(--crm-primary)] outline-none transition-all" />
    </div>

    <div>
      <sic-tiptap-editor
        label="คำอธิบาย"
        formControlName="description"
        placeholder="ระบุคำอธิบายหรือรายละเอียด Milestone..."
        minHeight="140px"
      ></sic-tiptap-editor>
    </div>

    <!-- Due Date + Time -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <sic-datepicker
          label="วันที่ครบกำหนด"
          formControlName="dueDate"
          [required]="true"
          placeholder="เลือกวันที่"
        ></sic-datepicker>
        @if (form.get('dueDate')?.touched && form.get('dueDate')?.invalid) {
          <p class="text-xs text-[var(--crm-danger)] mt-1">กรุณาระบุวันที่ครบกำหนด</p>
        }
      </div>
      <div>
        <sic-timepicker
          label="เวลาครบกำหนด"
          formControlName="dueTime"
          placeholder="เลือกเวลา"
        ></sic-timepicker>
      </div>
    </div>

    <!-- ✅ Color Picker -->
    <div>
      <sic-colorpicker
        label="เลือกสี Milestone"
        formControlName="color"
        placeholder="#E67E22"
      ></sic-colorpicker>
    </div>

    <div class="flex gap-3 pt-4 border-t border-[var(--border)]">
      <sic-button type="submit" variant="primary" [disabled]="form.invalid">
        <i class="bi bi-floppy"></i>
        {{ isEdit ? 'บันทึก' : 'สร้าง' }}
      </sic-button>
      <sic-button type="button" variant="secondary" (click)="cancel()">
        <i class="bi bi-arrow-left"></i>
        ยกเลิก
      </sic-button>
    </div>

  </form>
</div>
