<!-- src/app/feature/pm/dt/pmdt25/pmdt25.component.html -->
<div class="space-y-5 p-0.5">
  <!-- Header Card -->
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <button
        (click)="onBack()"
        class="w-9 h-9 rounded-lg flex items-center justify-center text-[var(--text-muted)] hover:text-[var(--crm-primary)] hover:bg-[var(--crm-primary)]/10 transition-all"
        title="กลับ"
      >
        <i class="bi bi-arrow-left text-xl"></i>
      </button>
      <div>
        <h1 class="text-2xl font-semibold text-[var(--text-active)] flex items-center gap-2">
          <i class="bi bi-clock-history text-[var(--crm-primary)]"></i>
          {{ isEdit() ? 'แก้ไขบันทึกเวอร์ชันเอกสาร (Edit Version Record)' : 'สร้างบันทึกเวอร์ชันเอกสารใหม่ (New Document Version)' }}
        </h1>
        <p class="text-sm text-[var(--text-muted)]">
          สร้างหรือแก้ไขประวัติ Version Control ประจำเอกสารโครงการ
        </p>
      </div>
    </div>
  </div>

  <!-- Main Form -->
  <form [formGroup]="formData.form" class="space-y-5">
    <div class="bg-[var(--sidebar)] p-5 rounded-xl shadow-sm border border-[var(--border)] space-y-4">
      <h3 class="text-base font-semibold text-[var(--text-active)] border-b border-[var(--border)] pb-3 flex items-center gap-2">
        <i class="bi bi-info-circle text-[var(--crm-primary)]"></i>
        รายละเอียดเวอร์ชันเอกสาร (Version Details)
      </h3>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <sic-combobox
          formControlName="documentType"
          label="ประเภทเอกสาร (Document Type)"
          [items]="docTypeOptions"
          valueField="value"
          displayField="label">
        </sic-combobox>

        <sic-input
          formControlName="documentCode"
          label="รหัสเอกสาร (Document Code)"
          placeholder="เช่น REQ-001, SPEC-002">
        </sic-input>

        <sic-input
          formControlName="versionNo"
          label="หมายเลขเวอร์ชัน (Version No)"
          placeholder="เช่น v1.0, v2.1">
        </sic-input>
      </div>

      <sic-input-area
        formControlName="changeSummary"
        label="ประวัติและสรุปการเปลี่ยนแปลง (Changelog Summary)"
        placeholder="ระบุสิ่งที่เปลี่ยนแปลง แก้ไขเพิ่มเติม หรือรายละเอียด revision...">
      </sic-input-area>
    </div>

    <!-- File Attachment -->
    <div class="bg-[var(--sidebar)] p-5 rounded-xl shadow-sm border border-[var(--border)] space-y-4">
      <h3 class="text-base font-semibold text-[var(--text-active)] border-b border-[var(--border)] pb-3 flex items-center gap-2">
        <i class="bi bi-paperclip text-[var(--crm-primary)]"></i>
        แนบไฟล์ฉบับนี้ (Document Version File)
      </h3>

      <sic-upload
        formControlName="fileRefId"
        [maxFiles]="1">
      </sic-upload>
    </div>

    <!-- Bottom Action Bar -->
    <div class="flex items-center justify-end gap-3 pt-4 border-t border-[var(--border)]">
      <sic-button variant="outline" (click)="onBack()">
        <i class="bi bi-arrow-left"></i> ยกเลิก
      </sic-button>
      <sic-button variant="primary" (click)="onSubmit()" [loading]="isSaving()">
        <i class="bi bi-check-lg"></i> บันทึกเวอร์ชัน
      </sic-button>
    </div>
  </form>
</div>
