<!-- src/app/feature/pm/dt/pmdt01/pmdt01A/pmdt01A.component.html -->
<div class="max-w-2xl mx-auto">
  <h2 class="text-xl font-semibold text-[var(--text-active)] mb-4">
    {{ phaseData.value.id ? 'แก้ไข Phase' : 'สร้าง Phase ใหม่' }}
  </h2>

  <form [formGroup]="phaseData.formGroup" (ngSubmit)="onSubmit()">
    <sic-grid [cols]="1" gap="1rem">
      <!-- Phase Name -->
      <sic-input
        label="ชื่อ Phase"
        formControlName="phaseName"
        [required]="true"
        placeholder="กรอกชื่อ Phase"
        [errorMessages]="{ required: 'กรุณากรอกชื่อ Phase' }"
      />

      <!-- Description -->
      <sic-input-area
        label="คำอธิบาย"
        formControlName="description"
        [rows]="3"
        placeholder="คำอธิบาย Phase (ถ้ามี)"
      />

      <!-- Start Date + Time -->
      <sic-grid [cols]="2" gap="1rem">
        <sic-datepicker
          label="วันที่เริ่ม"
          formControlName="startDate"
          [required]="true"
          placeholder="เลือกวันที่เริ่ม"
          [errorMessages]="{ required: 'กรุณาเลือกวันที่เริ่ม' }"
        />
        <sic-timepicker
          label="เวลาเริ่ม"
          formControlName="startTime"
          placeholder="เลือกเวลา"
        />
      </sic-grid>

      <!-- End Date + Time -->
      <sic-grid [cols]="2" gap="1rem">
        <sic-datepicker
          label="วันที่สิ้นสุด"
          formControlName="endDate"
          [required]="true"
          placeholder="เลือกวันที่สิ้นสุด"
          [errorMessages]="{ required: 'กรุณาเลือกวันที่สิ้นสุด' }"
        />
        <sic-timepicker
          label="เวลาสิ้นสุด"
          formControlName="endTime"
          placeholder="เลือกเวลา"
        />
      </sic-grid>

      <!-- Owner -->
      <sic-input
        label="ผู้รับผิดชอบ (Owner)"
        formControlName="owner"
        placeholder="ชื่อผู้รับผิดชอบ"
      />

      <!-- Color -->
      <sic-colorpicker
        label="เลือกสี Phase"
        formControlName="color"
        placeholder="#4A90D9"
      />

      <!-- Buttons -->
      <sic-flex direction="row" justify="end" gap="0.75rem" class="pt-4 border-t border-[var(--border)]">
        <sic-button type="button" variant="outline" (click)="cancel()">
          ยกเลิก
        </sic-button>
        <sic-button
          type="submit"
          color="primary"
          [disabled]="phaseData.invalid || isSaving()"
          [loading]="isSaving()"
        >
          {{ phaseData.value.id ? 'บันทึก' : 'สร้าง' }}
        </sic-button>
      </sic-flex>
    </sic-grid>
  </form>
</div>
