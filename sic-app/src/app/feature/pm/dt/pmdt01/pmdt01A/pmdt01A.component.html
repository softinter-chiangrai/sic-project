<div class="max-w-2xl mx-auto">
  <h2 class="text-xl font-semibold text-[var(--text-active)] mb-4">
    {{ isEdit ? 'แก้ไข Phase' : 'สร้าง Phase ใหม่' }}
  </h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

    <!-- Phase Code & Phase Name -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-[var(--text)]">รหัส Phase<span class="text-red-500">*</span></label>
        <input
          type="text"
          formControlName="phaseCode"
          placeholder="PH-001"
          class="w-full px-3 py-2 rounded-lg border border-[var(--border)] bg-[var(--bg)] text-[var(--text)] font-mono text-sm focus:ring-2 focus:ring-[var(--crm-primary)]/20 focus:border-[var(--crm-primary)] outline-none transition-all"
        />
      </div>
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-[var(--text)]">ชื่อ Phase <span class="text-red-500">*</span></label>
        <input
          type="text"
          formControlName="phaseName"
          placeholder="ระบุชื่อ Phase"
          class="w-full px-3 py-2 rounded-lg border border-[var(--border)] bg-[var(--bg)] text-[var(--text)] focus:ring-2 focus:ring-[var(--crm-primary)]/20 focus:border-[var(--crm-primary)] outline-none transition-all"
        />
      </div>
    </div>

    <!-- Description -->
    <div>
      <sic-tiptap-editor
        label="คำอธิบาย"
        formControlName="description"
        placeholder="ระบุคำอธิบายหรือรายละเอียดของ Phase..."
        minHeight="140px"
      ></sic-tiptap-editor>
    </div>

    <!-- Start Date + Time -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <sic-datepicker
          label="วันที่เริ่ม"
          formControlName="startDate"
          [required]="true"
          placeholder="เลือกวันที่เริ่ม"
        ></sic-datepicker>
        @if (form.get('startDate')?.touched && form.get('startDate')?.invalid) {
          <p class="text-xs text-[var(--crm-danger)] mt-1">กรุณาระบุวันที่เริ่ม</p>
        }
      </div>
      <div>
        <sic-timepicker
          label="เวลาเริ่ม"
          formControlName="startTime"
          placeholder="เลือกเวลา"
        ></sic-timepicker>
      </div>
    </div>

    <!-- End Date + Time -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <sic-datepicker
          label="วันที่สิ้นสุด"
          formControlName="endDate"
          [required]="true"
          placeholder="เลือกวันที่สิ้นสุด"
        ></sic-datepicker>
        @if (form.get('endDate')?.touched && form.get('endDate')?.invalid) {
          <p class="text-xs text-[var(--crm-danger)] mt-1">กรุณาระบุวันที่สิ้นสุด</p>
        }
      </div>
      <div>
        <sic-timepicker
          label="เวลาสิ้นสุด"
          formControlName="endTime"
          placeholder="เลือกเวลา"
        ></sic-timepicker>
      </div>
    </div>

    <!-- Owner (Multiple) -->
    <div>
      <sic-combobox
        label="ผู้รับผิดชอบ (Owner)"
        formControlName="owner"
        [apiUrl]="userApiUrl"
        valueField="value"
        textField="text"
        placeholder="พิมพ์หรือเลือกผู้รับผิดชอบ..."
        [clearable]="true"
        [multiple]="true"
        (selectionChanged)="onOwnerSelectionChanged($event)"
      ></sic-combobox>
    </div>

    <!-- ✅ Color Picker -->
    <div>
      <sic-colorpicker
        label="เลือกสี Phase"
        formControlName="color"
        placeholder="#4A90D9"
      ></sic-colorpicker>
    </div>

    <!-- Buttons -->
    <div class="flex gap-3 pt-4 border-t border-[var(--border)]">
      <sic-button type="submit" variant="primary" [disabled]="form.invalid">
        <i class="bi bi-floppy"></i>
        {{ isEdit ? 'บันทึก' : 'สร้าง' }}
      </sic-button>
      <sic-button type="button" variant="secondary" (click)="cancel()">
        <i class="bi bi-arrow-left"></i>
        ยกเลิก
      </sic-button>
    </div>

  </form>
</div>
