<div class="p-6 max-w-5xl mx-auto space-y-6">
  <!-- Header Card -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
    <div class="flex items-center gap-3">
      <div class="p-3 bg-amber-50 dark:bg-amber-950/50 rounded-xl text-amber-600 dark:text-amber-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">
          {{ isEdit() ? 'แก้ไขบันทึกเวอร์ชันเอกสาร (Edit Version Record)' : 'สร้างบันทึกเวอร์ชันเอกสารใหม่ (New Document Version)' }}
        </h1>
        <p class="text-sm text-slate-500 dark:text-slate-400">
          สร้างหรือแก้ไขประวัติ Version Control ประจำเอกสารโครงการ
        </p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button sic-button variant="outline" (click)="onBack()">
        ← ยกเลิก / กลับ
      </button>
      <button sic-button variant="primary" (click)="onSubmit()" [disabled]="isSaving()">
        {{ isSaving() ? 'กำลังบันทึก...' : '💾 บันทึกเวอร์ชัน' }}
      </button>
    </div>
  </div>

  <!-- Main Form -->
  <form [formGroup]="formData.form" class="space-y-6">
    <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
      <h3 class="text-base font-semibold text-slate-800 dark:text-slate-100 border-b border-slate-200 dark:border-slate-700 pb-3">
        📌 รายละเอียดเวอร์ชันเอกสาร (Version Details)
      </h3>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <sic-combobox
          formControlName="documentType"
          label="ประเภทเอกสาร (Document Type)"
          [options]="docTypeOptions"
          valueField="value"
          displayField="label">
        </sic-combobox>

        <sic-input
          formControlName="documentCode"
          label="รหัสเอกสาร (Document Code)"
          placeholder="เช่น REQ-001, SPEC-002">
        </sic-input>

        <sic-input
          formControlName="versionNo"
          label="หมายเลขเวอร์ชัน (Version No)"
          placeholder="เช่น v1.0, v2.1">
        </sic-input>
      </div>

      <sic-input-area
        formControlName="changeSummary"
        label="ประวัติและสรุปการเปลี่ยนแปลง (Changelog Summary)"
        placeholder="ระบุสิ่งที่เปลี่ยนแปลง แก้ไขเพิ่มเติม หรือรายละเอียด revision...">
      </sic-input-area>
    </div>

    <!-- File Attachment -->
    <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
      <h3 class="text-base font-semibold text-slate-800 dark:text-slate-100 border-b border-slate-200 dark:border-slate-700 pb-3">
        📎 แนบไฟล์ฉบับนี้ (Document Version File)
      </h3>

      <sic-upload
        formControlName="fileRefId"
        [maxFiles]="1">
      </sic-upload>
    </div>
  </form>
</div>
