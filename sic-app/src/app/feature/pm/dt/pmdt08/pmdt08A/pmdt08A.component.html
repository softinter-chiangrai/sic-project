<!-- src/app/feature/pm/dt/pmdt09/pmdt09A/pmdt09A.component.html -->

<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in" (click)="closeModal()">
  <div
    class="bg-[var(--bg)] border border-[var(--border)] w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-scale-up"
    (click)="$event.stopPropagation()"
  >
    <!-- Modal Header -->
    <div class="relative flex items-center justify-center px-4 py-3.5 border-b border-[var(--border)] bg-[var(--sidebar)]">
      <h2 class="text-lg font-bold text-[var(--text-active)]">
        {{ isEdit ? 'แก้ไขโพสต์' : 'สร้างโพสต์ใหม่' }}
      </h2>
      <button
        type="button"
        (click)="closeModal()"
        class="absolute right-3.5 top-3.5 w-8 h-8 rounded-full bg-[var(--bg)] hover:bg-[var(--sidebar-hover)] flex items-center justify-center text-[var(--text-muted)] hover:text-[var(--text-active)] transition-colors"
        title="ปิด"
      >
        <i class="bi bi-x-lg text-base"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="p-5 overflow-y-auto space-y-4 flex-1">
      <!-- User Info -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-full overflow-hidden border border-[var(--border)] bg-[var(--crm-primary)]/10 flex items-center justify-center flex-shrink-0">
          @if (currentUserAvatar) {
            <img [src]="currentUserAvatar" [alt]="currentUserName" class="w-full h-full object-cover" />
          } @else {
            <span class="text-base font-bold text-[var(--crm-primary)]">
              {{ currentUserName.charAt(0) || 'U' }}
            </span>
          }
        </div>
        <div>
          <h3 class="font-semibold text-sm text-[var(--text-active)]">{{ currentUserName }}</h3>
          <span class="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-[var(--sidebar-hover)] text-[var(--text-muted)]">
            <i class="bi bi-globe"></i> สาธารณะในโครงการ
          </span>
        </div>
      </div>

      <!-- Form -->
      <form [formGroup]="postForm" (ngSubmit)="submitPost()" id="pmdt09aForm" class="space-y-3">
        <div>
          <sic-input
            label="หัวข้อเรื่อง"
            formControlName="subject"
            placeholder="ตั้งหัวข้อสำหรับการพูดคุย..."
            [required]="true"
          ></sic-input>
        </div>

        <div>
          <sic-input-area
            label="รายละเอียด"
            formControlName="content"
            [rows]="4"
            placeholder="คุณกำลังคิดอะไรอยู่? แชร์ความคิดเห็นหรือสอบถามกับทีม..."
            [required]="true"
          ></sic-input-area>
        </div>

        <div class="border border-[var(--border)] rounded-xl p-3 bg-[var(--sidebar)]/50">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-medium text-[var(--text-muted)] flex items-center gap-1.5">
              <i class="bi bi-paperclip text-sm text-[var(--crm-primary)]"></i>
              แนบรูปภาพหรือเอกสาร
            </span>
          </div>
          <!-- ✅ ใช้ uploadGroupId binding โดยตรง -->
          <sic-input-upload
            label=""
            formControlName="attachmentGroupId"
            [multiple]="true"
            category="all"
            [visibility]="1"
            [uploadGroupId]="postToEdit?.attachmentGroupId || null"
            [helperText]="'คลิกหรือลากไฟล์เพื่อแนบไฟล์ประกอบโพสต์'"
          ></sic-input-upload>
        </div>
      </form>
    </div>

    <!-- Modal Footer -->
    <div class="px-5 py-3.5 border-t border-[var(--border)] bg-[var(--sidebar)] flex items-center justify-end gap-2">
      <sic-button
        [fullWidth]="false"
        type="button"
        variant="outline"
        (click)="closeModal()"
        [disabled]="isSubmitting"
      >
        ยกเลิก
      </sic-button>
      <sic-button
        [fullWidth]="false"
        type="submit"
        form="pmdt09aForm"
        variant="primary"
        (click)="submitPost()"
        [disabled]="isSubmitting || postForm.invalid"
      >
        @if (isSubmitting) {
          <i class="bi bi-arrow-repeat animate-spin mr-1"></i> กำลังบันทึก...
        } @else {
          <i class="bi bi-check2 mr-1"></i> {{ isEdit ? 'บันทึกการแก้ไข' : 'โพสต์' }}
        }
      </sic-button>
    </div>
  </div>
</div>
