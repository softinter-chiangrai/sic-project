<!-- src/app/feature/pm/rt/pmrt01/pmrt01.component.html -->
<sic-flex direction="column" gap="1rem">
  <!-- HEADER -->
  <sic-flex direction="row" justify="between" align="center">
    <div>
      <h1 class="text-2xl font-semibold text-[var(--text-active)] flex items-center gap-2">
        <i class="bi bi-people-fill text-[var(--crm-primary)]"></i>
        รายการลูกค้า
      </h1>
      <sic-text color="muted" size="sm">จัดการข้อมูลลูกค้าทั้งหมด</sic-text>
    </div>
    <sic-button color="primary" (click)="goToAdd()">
      <i class="bi bi-plus-lg"></i> เพิ่มลูกค้า
    </sic-button>
  </sic-flex>

  <!-- FILTER BAR -->
  <sic-flex direction="row" gap="0.75rem" wrap="wrap">
    <div class="relative flex-1 min-w-[200px]">
      <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-muted)] text-sm"></i>
      <input
        type="text"
        class="w-full pl-9 pr-9 py-2 rounded-lg border border-[var(--border)] bg-[var(--bg)] text-[var(--text)] text-sm focus:outline-none focus:ring-2 focus:ring-[var(--crm-primary)]/20 focus:border-[var(--crm-primary)] transition-all"
        placeholder="ค้นหาชื่อ, อีเมล, เบอร์โทร หรือรหัส..."
        [value]="searchTerm()"
        (input)="onSearch($event)"
      />
      @if (searchTerm()) {
        <button
          (click)="clearSearch()"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-[var(--text-muted)] hover:text-[var(--text-active)] transition-colors"
        >
          <i class="bi bi-x-lg text-xs"></i>
        </button>
      }
    </div>

    <select
      (change)="onFilterChange($event)"
      [value]="filterStatus()"
      class="px-3 py-2 rounded-lg border border-[var(--border)] bg-[var(--bg)] text-[var(--text)] text-sm focus:outline-none focus:ring-2 focus:ring-[var(--crm-primary)]/20 focus:border-[var(--crm-primary)] appearance-none pr-8 cursor-pointer transition-all"
    >
      <option value="all">🌐 ทั้งหมด</option>
      <option value="active">✅ ใช้งาน</option>
      <option value="inactive">⛔ ไม่ใช้งาน</option>
    </select>
  </sic-flex>

  <!-- GRID -->
  <sic-card [bordered]="true" [elevated]="true">
    <sic-gridpanel
      #customerGrid
      [config]="gridConfig"
      (loadData)="handleGridLoad($event)"
      (rowAction)="handleGridRowAction($event)"
    >
      <!-- Custom column: companyNameEn -->
      <ng-template sicGridPanelTemplate="companyNameEn" section="cell" let-row>
        <div class="flex items-center gap-3">
          <sic-avatar
            [name]="row.companyNameEn"
            [src]="getImageUrl(row)"
            size="sm"
          ></sic-avatar>
          <div class="min-w-0">
            <div class="font-medium text-[var(--text-active)] truncate">
              {{ row.companyNameEn }}
            </div>
            @if (row.companyNameLocal) {
              <div class="text-xs text-[var(--text-muted)] truncate">
                {{ row.companyNameLocal }}
              </div>
            }
          </div>
        </div>
      </ng-template>

      <!-- Custom column: isActive -->
      <ng-template sicGridPanelTemplate="isActive" section="cell" let-row>
        <span
          class="inline-block px-2.5 py-0.5 rounded-full text-xs font-medium"
          [class.bg-emerald-100]="row.isActive"
          [class.text-emerald-700]="row.isActive"
          [class.bg-gray-100]="!row.isActive"
          [class.text-gray-500]="!row.isActive"
        >
          {{ row.isActive ? 'ใช้งาน' : 'ไม่ใช้งาน' }}
        </span>
      </ng-template>

      <!-- Custom column: actions -->
      <ng-template sicGridPanelTemplate="actions" section="cell" let-row>
        <div class="flex items-center justify-center gap-1">
          <sic-button
            variant="ghost"
            size="sm"
            color="primary"
            (click)="handleGridRowAction({ action: 'projects', row: row })"
            title="ดูโครงการทั้งหมด"
          >
            <i class="bi bi-briefcase"></i>
          </sic-button>
          <sic-button
            variant="ghost"
            size="sm"
            color="warning"
            (click)="handleGridRowAction({ action: 'edit', row: row })"
            title="แก้ไข"
          >
            <i class="bi bi-pencil"></i>
          </sic-button>
          <sic-button
            variant="ghost"
            size="sm"
            [color]="row.isActive ? 'success' : 'primary'"
            (click)="handleGridRowAction({ action: 'toggleActive', row: row })"
            [title]="row.isActive ? 'ปิดใช้งาน' : 'เปิดใช้งาน'"
          >
            <i class="bi" [class.bi-check-circle-fill]="row.isActive" [class.bi-x-circle]="!row.isActive"></i>
          </sic-button>
          <sic-button
            variant="ghost"
            size="sm"
            color="danger"
            (click)="handleGridRowAction({ action: 'delete', row: row })"
            title="ลบ"
          >
            <i class="bi bi-trash"></i>
          </sic-button>
        </div>
      </ng-template>
    </sic-gridpanel>
  </sic-card>
</sic-flex>
