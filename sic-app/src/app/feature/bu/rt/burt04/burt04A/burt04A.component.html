<!-- src/app/feature/bu/rt/pmrt29/burt04A/burt04A.component.html -->

@if (isLoading()) {
  <div class="flex flex-col items-center justify-center py-16 gap-4">
    <div
      class="w-12 h-12 border-4 border-[var(--border)] border-t-[var(--crm-primary)] rounded-full animate-spin"
    ></div>
    <p class="text-[var(--text-muted)]">กำลังโหลดข้อมูล...</p>
  </div>
}

@if (!isLoading()) {
  <form [formGroup]="form" (ngSubmit)="submit()" class="max-w-2xl mx-auto p-4 space-y-6">
    <h2 class="text-3xl font-semibold text-center text-[var(--text-active)]">
      {{ isEdit ? 'แก้ไขข้อมูลสมาชิก' : 'เพิ่มสมาชิกในธุรกิจ' }}
    </h2>

    <!-- User Info (readonly) -->
    <sic-input label="ชื่อผู้ใช้" formControlName="userName" [disabled]="true"></sic-input>

    <sic-input label="อีเมล" formControlName="userEmail" [disabled]="true"></sic-input>

    <!-- ✅ เลือกบทบาท -->
    <div>
      <sic-combobox
        label="บทบาทในธุรกิจ"
        formControlName="roleIds"
        [apiUrl]="roleComboboxUrl"
        valueField="value"
        textField="text"
        placeholder="พิมพ์หรือเลือกบทบาท..."
        [clearable]="true"
        [multiple]="true"
        [errorMessages]="{ required: 'กรุณาเลือกบทบาทอย่างน้อย 1 บทบาท' }"
      ></sic-combobox>
    </div>

    <!-- Active Status -->
    <label class="flex items-center gap-2 cursor-pointer text-sm">
      <input
        type="checkbox"
        formControlName="isActive"
        class="w-4 h-4 rounded border-[var(--border)] text-[var(--crm-primary)] focus:ring-[var(--crm-primary)]/20"
      />
      <span class="text-[var(--text-active)]">เปิดใช้งานสมาชิก</span>
    </label>

    <!-- Buttons -->
    <div class="flex gap-4 pt-4">
      <sic-button [fullWidth]="true" type="button" variant="secondary" (click)="onBack()">
        <i class="bi bi-arrow-left"></i> ย้อนกลับ
      </sic-button>
      <sic-button [fullWidth]="true" type="submit" variant="primary" [disabled]="isSaving()">
        @if (isSaving()) {
          <i class="bi bi-arrow-repeat animate-spin"></i>
        } @else {
          <i class="bi bi-floppy"></i>
        }
        {{ isSaving() ? 'กำลังบันทึก...' : 'บันทึก' }}
      </sic-button>
    </div>
  </form>
}
