<span
  class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium border"
  [ngClass]="{
    'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/30': badgeClass === 'sic-version-badge--approved',
    'bg-amber-500/15 text-amber-600 dark:text-amber-400 border-amber-500/30': badgeClass === 'sic-version-badge--changed',
    'bg-slate-500/10 text-[var(--text-muted)] border-slate-500/20': badgeClass === 'sic-version-badge--draft'
  }"
>
  @if (displayVersion) {
    <span class="font-mono">{{ displayVersion }}</span>
  }
  <span>{{ displayLabel }}</span>
  @if (isLocked) {
    <i class="bi bi-lock-fill text-[10px]"></i>
  }
</span>
