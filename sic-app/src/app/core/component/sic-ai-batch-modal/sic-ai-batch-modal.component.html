<div class="ai-batch-backdrop" *ngIf="visible" (click)="close()"></div>

<div class="ai-batch-modal" *ngIf="visible">
  <div class="ai-batch-header">
    <div class="ai-batch-title">
      <i class="bi bi-stars"></i>
      <span>{{ 'AI_BATCH_TITLE' | translate }}{{ moduleLabel ? ' - ' + moduleLabel : '' }}</span>
    </div>
    <button type="button" class="ai-batch-close" (click)="close()" [attr.aria-label]="'AI_BATCH_CLOSE' | translate">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="ai-batch-body">
    <!-- Prompt panel -->
    <div class="ai-batch-prompt-panel">
      <label class="ai-batch-label">{{ 'AI_BATCH_PROMPT_LABEL' | translate }}</label>
      <textarea
        class="ai-batch-textarea"
        rows="3"
        [placeholder]="'AI_BATCH_PROMPT_PLACEHOLDER' | translate"
        [ngModel]="prompt()"
        (ngModelChange)="prompt.set($event)"
      ></textarea>

      <div class="ai-batch-controls-row">
        <div class="ai-batch-control">
          <label class="ai-batch-label">{{ 'AI_BATCH_COUNT_LABEL' | translate }}</label>
          <input
            type="number"
            class="ai-batch-number"
            min="1"
            max="30"
            [ngModel]="count()"
            (ngModelChange)="count.set($event)"
          />
        </div>

        <div class="ai-batch-control ai-batch-control-grow">
          <label class="ai-batch-label">{{ 'AI_BATCH_MODEL_LABEL' | translate }}</label>
          <select class="ai-batch-select" [ngModel]="model()" (ngModelChange)="model.set($event)">
            <option *ngFor="let m of aiModels" [value]="m.id">{{ m.name }}</option>
          </select>
        </div>
      </div>

      <div class="ai-batch-attachments">
        <label class="ai-batch-attach-btn">
          <i class="bi bi-paperclip"></i>
          {{ 'AI_BATCH_ATTACH_FILE' | translate }}
          <input type="file" multiple hidden (change)="onFileSelected($event)" />
        </label>

        <div class="ai-batch-file-chip" *ngFor="let f of attachedFiles(); let i = index">
          <i class="bi" [ngClass]="f.type.startsWith('image/') ? 'bi-image' : 'bi-file-earmark-text'"></i>
          <span class="ai-batch-file-name">{{ f.name }}</span>
          <button type="button" (click)="removeFile(i)" [attr.aria-label]="'AI_BATCH_REMOVE_FILE' | translate">
            <i class="bi bi-x"></i>
          </button>
        </div>
      </div>

      <button type="button" class="ai-batch-generate-btn" [disabled]="isGenerating() || !prompt().trim()" (click)="generate()">
        <i class="bi" [ngClass]="isGenerating() ? 'bi-hourglass-split' : 'bi-magic'"></i>
        {{ isGenerating() ? ('AI_BATCH_GENERATING' | translate) : (rows().length ? ('AI_BATCH_GENERATE_MORE' | translate) : ('AI_BATCH_GENERATE' | translate)) }}
      </button>

      <div class="ai-batch-error" *ngIf="errorMessage()">{{ errorMessage() }}</div>
    </div>

    <!-- Preview table -->
    <div class="ai-batch-preview" *ngIf="rows().length">
      <div class="ai-batch-preview-header">
        <span>{{ 'AI_BATCH_REVIEW_HEADER' | translate: { selected: selectedCount, total: rows().length } }}</span>
      </div>

      <div class="ai-batch-table-wrap">
        <table class="ai-batch-table">
          <thead>
            <tr>
              <th class="ai-batch-col-check"></th>
              <th *ngFor="let f of fields">{{ f.label }}</th>
              <th class="ai-batch-col-action"></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of rows(); let i = index" [class.deselected]="!row.selected">
              <td class="ai-batch-col-check">
                <input type="checkbox" [checked]="row.selected" (change)="toggleRow(i)" />
              </td>
              <td *ngFor="let f of fields">
                <textarea
                  *ngIf="f.type === 'textarea'; else plainInput"
                  class="ai-batch-cell-textarea"
                  rows="2"
                  [ngModel]="row.data[f.key]"
                  (ngModelChange)="updateCell(i, f.key, $event)"
                ></textarea>
                <ng-template #plainInput>
                  <input
                    class="ai-batch-cell-input"
                    [type]="f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text')"
                    [ngModel]="row.data[f.key]"
                    (ngModelChange)="updateCell(i, f.key, $event)"
                  />
                </ng-template>
              </td>
              <td class="ai-batch-col-action">
                <button type="button" (click)="removeRow(i)" [attr.aria-label]="'AI_BATCH_REMOVE_ROW' | translate">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="ai-batch-footer" *ngIf="rows().length">
    <span class="ai-batch-hint">{{ 'AI_BATCH_APPEND_HINT' | translate }}</span>
    <button type="button" class="ai-batch-save-btn" [disabled]="!selectedCount || saving" (click)="saveAll()">
      <i class="bi" [ngClass]="saving ? 'bi-hourglass-split' : 'bi-save'"></i>
      {{ (saving ? 'AI_BATCH_SAVING' : 'AI_BATCH_SAVE_ALL') | translate: { count: selectedCount } }}
    </button>
  </div>
</div>
