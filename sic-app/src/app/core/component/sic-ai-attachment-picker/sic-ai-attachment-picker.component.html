<div>
  <label class="block text-xs font-semibold text-[var(--text-muted)] uppercase tracking-wider mb-1">
    <i class="bi bi-paperclip text-[var(--crm-primary)] mr-1"></i>
    {{ 'AI_DRAFT_ATTACH_LABEL' | translate }}
  </label>
  <div class="flex flex-wrap items-center gap-2">
    <label class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-dashed border-[var(--crm-primary)]/40 text-[var(--crm-primary)] text-xs cursor-pointer hover:bg-[var(--crm-primary)]/10 transition-all">
      <i class="bi bi-upload"></i>
      {{ 'AI_DRAFT_CHOOSE_FILE' | translate }}
      <input type="file" multiple hidden (change)="onFileSelected($event)" />
    </label>

    <span
      class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[var(--bg)] border border-[var(--border)] text-xs"
      *ngFor="let f of files; let i = index; trackBy: trackByFile"
    >
      <i class="bi" [ngClass]="f.type.startsWith('image/') ? 'bi-image' : 'bi-file-earmark-text'"></i>
      <span class="max-w-[120px] truncate">{{ f.name }}</span>
      <button type="button" (click)="removeFile(i)" class="text-[var(--text-muted)] hover:text-rose-500 cursor-pointer">
        <i class="bi bi-x"></i>
      </button>
    </span>
  </div>
</div>
