<!-- Backdrop -->
<div
  class="fixed inset-0 z-[1000] bg-[color-mix(in_srgb,var(--text-active)_28%,transparent)] opacity-0 pointer-events-none transition-opacity duration-200 backdrop-blur-sm"
  [class.opacity-100]="isOpen"
  [class.pointer-events-auto]="isOpen"
  (click)="onBackdropClick()"
  aria-hidden="true"
></div>

<!-- Panel -->
<aside
  class="fixed inset-y-0 right-0 z-[1001] flex h-full w-full translate-x-full flex-col overflow-hidden border-l border-[var(--border)] bg-[var(--bg)] text-[var(--text)] shadow-2xl transition-transform duration-200"
  [class.translate-x-0]="isOpen"
  [ngClass]="sizeClass[size]"
  role="dialog"
  aria-modal="true"
>
  <div class="flex flex-shrink-0 items-center justify-between border-b border-[var(--border)] px-5 py-4">
    <h2 class="truncate text-[1rem] font-semibold text-[var(--text-active)]">{{ title }}</h2>
    <button
      type="button"
      class="grid h-8 w-8 flex-shrink-0 place-items-center rounded-lg text-[var(--text-muted)] transition-colors hover:bg-[var(--sidebar-hover)] hover:text-[var(--text-active)] cursor-pointer"
      [attr.aria-label]="'DRAWER_CLOSE_LABEL' | translate"
      (click)="close()"
    >
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="flex-1 overflow-y-auto px-5 py-4">
    <ng-content></ng-content>
  </div>

  <div class="flex-shrink-0 border-t border-[var(--border)] px-5 py-3 [&:empty]:hidden">
    <ng-content select="[drawer-footer]"></ng-content>
  </div>
</aside>
