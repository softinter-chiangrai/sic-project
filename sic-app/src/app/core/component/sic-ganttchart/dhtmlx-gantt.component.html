<!-- dhtmlx-gantt.component.html -->
<div class="gantt-wrapper">
  <!-- Gantt Toolbar / Month Selector (ลบปุ่ม View Mode ออกแล้ว) -->
  <div class="gantt-toolbar flex flex-wrap items-center justify-between gap-3 mb-3 p-2.5 bg-[var(--bg)] rounded-xl border border-[var(--border)]">
    <!-- Month Picker & Navigation Controls -->
    <div class="flex items-center gap-2">
      <button (click)="shiftDate(-1)" title="เดือนก่อนหน้า" class="w-8 h-8 flex items-center justify-center rounded-lg border border-[var(--border)] bg-[var(--sidebar)] hover:bg-[var(--sidebar-hover)] text-[var(--text-active)] transition-colors">
        <i class="bi bi-chevron-left text-xs"></i>
      </button>
      
      <!-- Input เลือกเดือนโดยตรง -->
      <div class="flex items-center gap-2 bg-[var(--sidebar)] border border-[var(--border)] px-3 py-1 rounded-lg">
        <i class="bi bi-calendar-event text-[var(--crm-primary)] text-xs"></i>
        <span class="text-xs text-[var(--text-muted)] font-medium">เลือกเดือน:</span>
        <input
          type="month"
          [value]="currentMonth()"
          (change)="onMonthChange($event)"
          class="bg-transparent text-xs font-semibold text-[var(--text-active)] outline-none cursor-pointer"
        />
      </div>

      <button (click)="shiftDate(1)" title="เดือนถัดไป" class="w-8 h-8 flex items-center justify-center rounded-lg border border-[var(--border)] bg-[var(--sidebar)] hover:bg-[var(--sidebar-hover)] text-[var(--text-active)] transition-colors">
        <i class="bi bi-chevron-right text-xs"></i>
      </button>
    </div>
  </div>

  <div #ganttContainer class="dhtmlx-gantt-container"></div>
</div>
