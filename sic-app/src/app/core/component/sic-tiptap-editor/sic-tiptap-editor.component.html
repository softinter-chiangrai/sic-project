<!-- src/app/core/component/sic-tiptap-editor/sic-tiptap-editor.component.html -->

<!-- ====== Editor หลัก (แสดงเมื่อไม่ใช่ fullscreen) ====== -->
@if (!fullscreen) {
  <div class="sic-tiptap-container">
    @if (label) {
      <div class="flex items-center justify-between mb-1.5">
        <label class="text-sm font-medium text-[var(--text-active)]">
          {{ label }}
          @if (required) {
            <span class="text-red-500 font-bold">*</span>
          }
        </label>
        @if (hint) {
          <span class="text-xs text-[var(--text-muted)]">{{ hint }}</span>
        }
      </div>
    }

    <div
      class="sic-tiptap-editor"
      [class.disabled]="disabledState()"
      [style.min-height]="minHeightState()"
      [style.max-height]="maxHeightState()"
    >
      <angular-tiptap-editor
        [config]="editorConfig()"
        [content]="content()"
        [editable]="!disabledState()"
        (contentChange)="onContentChange($event)"
      ></angular-tiptap-editor>

      <!-- ปุ่มขยายเพื่อเปิด fullscreen -->
      <button type="button" class="sic-tiptap-expand-btn" (click)="openFullscreen($event)" title="ขยายเต็มจอ">
        <i class="bi bi-arrows-fullscreen"></i>
      </button>
    </div>

    <!-- แสดง error ถ้ามี -->
    @if (showError() && errorMessage()) {
      <div class="sic-tiptap-error">{{ errorMessage() }}</div>
    }
  </div>
}

<!-- ====== Full‑screen overlay ====== -->
@if (fullscreen) {
  <div class="fullscreen-overlay" (click)="closeFullscreen($event)">
    <div class="fullscreen-container" (click)="$event.stopPropagation()">
      <!-- Header -->
      <div class="fullscreen-header">
        <span class="fullscreen-title">✏️ แก้ไขข้อความ</span>
        <button type="button" class="fullscreen-close-btn" (click)="closeFullscreen($event)">
          <i class="bi bi-x-lg"></i> ปิด
        </button>
      </div>

      <!-- Editor -->
      <div class="fullscreen-editor-wrapper">
        <angular-tiptap-editor
          [config]="editorConfig()"
          [content]="content()"
          [editable]="!disabledState()"
          (contentChange)="onContentChange($event)"
        ></angular-tiptap-editor>
      </div>
    </div>
  </div>
}
